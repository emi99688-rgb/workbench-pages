/* ===== 全局快速打开（⌘K / Ctrl+K） ===== */
function allToolLinks(){
  const out = [];
  CATS.filter(c => !c.home).forEach(c => {
    const ms = modulesOf(c.id) || defaultModules(c.id);
    (ms || []).forEach(m => (m.links || []).forEach(l => {
      if(l.name && l.url) out.push({ name: l.name, url: l.url, cat: c.label, visits: l.visits || 0 });
    }));
  });
  return out;
}
let qkIndex = 0, qkItems = [];
function openQuickPalette(){
  const back = $("qkBack"); if(!back) return;
  back.hidden = false;
  const inp = $("qkInput"); inp.value = ""; setTimeout(() => inp.focus(), 20);
  renderQkList("");
}
function closeQuickPalette(){ const back = $("qkBack"); if(back) back.hidden = true; }
function renderQkList(q){
  const list = $("qkList"); if(!list) return;
  const all = allToolLinks();
  const query = (q || "").trim().toLowerCase();
  let items;
  if(query){
    items = all.filter(t => t.name.toLowerCase().indexOf(query) >= 0 || (t.url || "").toLowerCase().indexOf(query) >= 0 || t.cat.toLowerCase().indexOf(query) >= 0);
  } else {
    items = all.slice().sort((a, b) => b.visits - a.visits).slice(0, 12);
  }
  qkItems = items; qkIndex = 0;
  if(!items.length){ list.innerHTML = '<div class="qk-empty">未找到匹配的工具<br/>换个关键词试试</div>'; return; }
  list.innerHTML = "";
  items.forEach((t, i) => {
    const it = document.createElement("div"); it.className = "qk-item" + (i === 0 ? " active" : "");
    const ico = createIcon(t.name, t.url, "ico");
    const meta = document.createElement("div"); meta.className = "qk-meta";
    meta.innerHTML = '<div class="qk-name">' + esc(t.name) + '</div><div class="qk-cat">' + esc(t.cat) + '</div>';
    const vis = document.createElement("div"); vis.className = "qk-vis";
    vis.innerHTML = t.visits ? ('用 <b>' + t.visits + '</b>') : '未使用';
    it.append(ico, meta, vis);
    it.onmouseenter = () => { qkIndex = i; updateQkActive(); };
    it.onclick = () => openQkItem(i);
    list.appendChild(it);
  });
}
function updateQkActive(){
  document.querySelectorAll("#qkList .qk-item").forEach((el, i) => el.classList.toggle("active", i === qkIndex));
}
function openQkItem(i){
  const t = qkItems[i]; if(!t) return;
  closeQuickPalette();
  openLink(t.url);
}

const qkBack = $("qkBack");
if(qkBack){
  const qkInput = $("qkInput");
  if(qkInput) qkInput.addEventListener("input", () => renderQkList(qkInput.value));
  qkBack.addEventListener("click", e => { if(e.target === qkBack) closeQuickPalette(); });
}
const qkHint = $("qkHint"); if(qkHint) qkHint.onclick = openQuickPalette;

document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    const back = $("qkBack");
    if(back && back.hidden) openQuickPalette(); else closeQuickPalette();
    return;
  }
  const back = $("qkBack");
  if(back && !back.hidden){
    if(e.key === "Escape"){ closeQuickPalette(); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); qkIndex = Math.min(qkIndex + 1, qkItems.length - 1); updateQkActive(); const el = document.querySelectorAll("#qkList .qk-item")[qkIndex]; if(el) el.scrollIntoView({ block:"nearest" }); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); qkIndex = Math.max(qkIndex - 1, 0); updateQkActive(); const el = document.querySelectorAll("#qkList .qk-item")[qkIndex]; if(el) el.scrollIntoView({ block:"nearest" }); }
    else if(e.key === "Enter"){ e.preventDefault(); openQkItem(qkIndex); }
  }
});

/* 初始化（所有状态与函数先声明，再渲染） */
/* 主题切换（纯色板氛围，不涉及任何版权 IP） */

/* ========== 数据管理：导出 / 导入（跨设备同步兜底） ========== */
const BACKUP_KEYS = ["wb_modules","wb_mod_sort","wb_theme","wb_mood","wb_life","wb_ai","wb_links_v2","wb_links_ui","wb_links"];
let bkJson = "", bkName = "workbench-backup.json";
/* 本地时间戳（原 toISOString 为 UTC，比北京晚 8 小时，文件名对不上） */
function localStamp(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}
function doDownload(text, filename){
  try {
    const blob = new Blob([text], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return true;
  } catch(e){ return false; }
}
function openBackupDialog(json, filename, n, dlOk){
  bkJson = json; bkName = filename;
  const back = $("bkBack"); if(!back) return;
  const area = $("bkArea"), tip = $("bkTip");
  if(area) area.value = json;
  if(tip) tip.innerHTML = (dlOk
      ? "已触发下载，文件名 <b>" + esc(filename) + "</b>（通常在浏览器「下载」文件夹）。"
      : "浏览器阻止了自动下载。") +
      " 若找不到文件，直接点「复制到剪贴板」把下方 <b>" + n + "</b> 项数据粘到记事本另存为 .json 即可还原。";
  back.hidden = false;
  if(area) setTimeout(() => { area.focus(); area.select(); }, 30);
}
function closeBackupDialog(){ const back = $("bkBack"); if(back) back.hidden = true; }
function exportBackup(){
  const data = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if(v !== null) data[k] = v; });
  const payload = { app:"workbuddy-workbench", version:1, exportedAt:new Date().toISOString(), data };
  const json = JSON.stringify(payload, null, 2);
  const filename = "workbench-backup-" + localStamp() + ".json";
  const ok = doDownload(json, filename);          // 先尝试直接下载
  openBackupDialog(json, filename, Object.keys(data).length, ok);  // 无论成败都给可复制兜底
  toast(ok ? "已导出备份，若未弹出保存框请复制下方内容" : "下载被拦截，请在弹层里复制保存");
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(reader.result);
      // 兼容两种格式：{data:{...}} 或 直接是 {key:string} 映射
      const data = (raw && raw.data && typeof raw.data === "object") ? raw.data : (raw && typeof raw === "object" && !raw.app) ? raw : null;
      if(!data || typeof data !== "object"){ toast("文件格式不正确，导入已取消"); return; }
      if(!confirm("导入将覆盖当前本地的全部工作台数据（模块、链接、主题、排序等）。\n确定继续？建议先点「导出备份」留一份底。")) return;
      Object.keys(data).forEach(k => {
        let val = data[k];
        if(typeof val !== "string") val = JSON.stringify(val);
        if(k === "wb_modules"){
          try {
            const obj = JSON.parse(val);
            Object.keys(obj).forEach(p => { if(obj[p] && typeof obj[p] === "object") obj[p].v = MODS_VER; }); // 统一版本，确保被接受
            localStorage.setItem(k, JSON.stringify(obj));
          } catch(_) { localStorage.setItem(k, val); }
        } else {
          localStorage.setItem(k, val);
        }
      });
      toast("导入成功，正在刷新…");
      setTimeout(() => location.reload(), 700);
    } catch(e){ toast("导入失败：" + (e && e.message ? e.message : "解析错误")); }
  };
  reader.onerror = () => toast("读取文件失败");
  reader.readAsText(file);
}

CATS.forEach(c=>{ if(c.id !== "common" && c.id !== "life" && c.id !== "home" && MODULES[c.id]) loadModules(c.id); });
renderMenu();

if(gSearch){
  gSearch.addEventListener("input", () => { searchQ = gSearch.value.trim().toLowerCase(); renderDetail(); });
  gSearch.addEventListener("keydown", e => { if(e.key === "Escape"){ gSearch.value = ""; searchQ = ""; renderDetail(); } });
}
const footLinksEl = $("footLinks");
if(footLinksEl) footLinksEl.textContent = allLinksCount();

/* 版本戳显示 + 手动强制刷新 + 自动检测新版本 */
const appVerEl = $("appVer");
if(appVerEl) appVerEl.textContent = APP_VER;
const forceBtn = $("forceRefresh");
if(forceBtn) forceBtn.addEventListener("click", () => { toast("正在跳过缓存重新加载…"); setTimeout(forceReload, 300); });
checkUpdate();

/* 数据管理：导出 / 导入 按钮 */
const btnExport = $("btnExport");
const btnImport = $("btnImport");
const importFile = $("importFile");
if(btnExport) btnExport.addEventListener("click", exportBackup);
if(btnImport && importFile){
  btnImport.addEventListener("click", () => { importFile.value = ""; importFile.click(); });
  importFile.addEventListener("change", () => { if(importFile.files && importFile.files[0]) importBackup(importFile.files[0]); });
}

/* 备份弹层：下载 / 复制 / 关闭 */
const bkBackEl = $("bkBack");
if(bkBackEl){
  const bkDl = $("bkDownload"), bkCp = $("bkCopy");
  if($("bkClose")) $("bkClose").onclick = closeBackupDialog;
  if($("bkClose2")) $("bkClose2").onclick = closeBackupDialog;
  bkBackEl.addEventListener("click", e => { if(e.target === bkBackEl) closeBackupDialog(); });
  if(bkDl) bkDl.onclick = () => { if(doDownload(bkJson, bkName)) toast("已下载：" + bkName); else toast("下载失败，请改用「复制到剪贴板」"); };
  if(bkCp) bkCp.onclick = async () => {
    try {
      await navigator.clipboard.writeText(bkJson);
      toast("备份内容已复制，粘贴到记事本另存为 .json 即可");
    } catch(_){
      const area = $("bkArea");
      if(area){ area.focus(); area.select(); try { document.execCommand("copy"); toast("已复制备份内容"); } catch(_e){ toast("复制失败，请手动全选复制"); } }
    }
  };
}
/* ESC 关闭备份弹层（避免与 ⌘K 弹层抢占） */
document.addEventListener("keydown", e => {
  const bk = $("bkBack");
  if(bk && !bk.hidden && e.key === "Escape"){ e.stopPropagation(); closeBackupDialog(); }
}, true);
