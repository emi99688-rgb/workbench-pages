<style>
  :root {
    /* ===== 现代 dashboard：浅灰主区 + 黑金侧栏点缀 ===== */
    --bg:            linear-gradient(180deg, #F5F6F8 0%, #ECEDF0 100%);

    /* ===== 主区面板：白底（紧凑风格） ===== */
    --panel-bg:      #FFFFFF;
    --panel-border:  rgba(15, 23, 42, 0.06);
    --card-bg:       #FFFFFF;
    --tile-bg:       #FFFFFF;
    --surface:       #FFFFFF;

    /* ===== 文字（深灰，对比度优先） ===== */
    --text:          #1F2937;
    --text-2:        #6B7280;
    --text-3:        #9CA3AF;
    --neutral-line:  #E5E7EB;

    /* ===== 主色：金属金（弱化为辅助标识） ===== */
    --accent:        #EA580C;
    --accent-hover:  #B8941F;
    --accent-soft:   rgba(234, 88, 12, 0.10);
    --accent-ring:   rgba(234, 88, 12, 0.24);

    /* ===== 语义色 ===== */
    --sem-red:       #EF4444;
    --sem-amber:     #F59E0B;
    --sem-green:     #10B981;
    --sem-blue:      #3B82F6;
    --up:            var(--sem-red);
    --down:          var(--sem-green);
    --warn:          var(--sem-amber);

    /* ===== 结构与质感：紧凑 ===== */
    --hairline:      rgba(15, 23, 42, 0.05);
    --shadow:        0 4px 16px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
    --radius:        14px;
    --radius-sm:     10px;
    --gap:           10px;
    --pad:           clamp(12px, 1.6vw, 18px);

    /* ===== KPI 多色彩板（紫/橙/青/红/蓝/绿/琥珀/粉） ===== */
    --c-pink:        #EC4899;
    --c-orange:      #F97316;
    --c-lavender:    #8B5CF6;
    --c-peach:       #06B6D4;
    --c-rose:        #EF4444;
    --c-violet:      #6366F1;
    --c-salmon:      #10B981;
    --c-amber:       #F59E0B;

    /* ===== 装饰光斑（弱化） ===== */
    --blob1: rgba(139, 92, 246, 0.05);
    --blob2: rgba(16, 185, 129, 0.04);
    --blob3: rgba(59, 130, 246, 0.04);
    --blob4: rgba(245, 158, 11, 0.04);

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  }


  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--bg);
    min-height: 100dvh; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    line-height: 1.5; padding: var(--pad);
    padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    position: relative; overflow-x: hidden; }
  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: 0; pointer-events: none; }
  .blob.b1 { width: 460px; height: 460px; top: -160px; left: -100px; background: radial-gradient(circle, var(--blob1), transparent 70%); }
  .blob.b2 { width: 420px; height: 420px; top: 6%; right: -160px; background: radial-gradient(circle, var(--blob2), transparent 70%); }
  .blob.b3 { width: 520px; height: 520px; bottom: -200px; left: 28%; background: radial-gradient(circle, var(--blob3), transparent 70%); }
  .blob.b4 { width: 360px; height: 360px; bottom: 10%; right: 14%; background: radial-gradient(circle, var(--blob4), transparent 70%); }

  .app { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto;
    display: grid; grid-template-columns: 158px minmax(0,1fr) 280px; gap: var(--gap);
    height: calc(100dvh - 2 * var(--pad) - env(safe-area-inset-bottom)); }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  }

  /* === 品牌 logo（金丝分隔 + 紧致内边距） === */
  .brand {
    flex: none; padding: 18px 10px 14px;
    display: flex; align-items: center; gap: 9px;
    border-bottom: 1px solid rgba(234, 88, 12, 0.14);
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.4);
  }
  .brand .logo { width: 32px; height: 32px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, #FDBA74 0%, #FB923C 36%, #EA580C 62%, #9A3412 100%);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(234,88,12,.36), inset 0 1px 0 rgba(255,255,255,.32); }
  .brand .logo svg { width: 20px; height: 20px; display: block; }
  .brand-txt { display: flex; flex-direction: column; line-height: 1.04; }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
  .brand-sub { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-top: 2px; }

  /* === 侧栏：保留黑金质感（深底 + 金丝边） === */
  .menu-panel {
    background: linear-gradient(180deg, #0F1014 0%, #0A0B0E 100%);
    border: 1px solid rgba(234, 88, 12, 0.22);
    border-radius: var(--radius);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(234, 88, 12, 0.10);
    color: #C9C2AE;
  }
  .menu-panel .brand-name { color: #F2ECD9; }
  .menu-panel .brand-sub { color: #6E6A64; }
  .menu-panel .side-label { color: rgba(234, 88, 12, 0.70); }
  .menu-panel .menu-item { color: #C9C2AE; padding: 8px 8px; }
  .menu-panel .menu-item:hover { color: #F97316; background: rgba(234, 88, 12, 0.10); }
  .menu-panel .menu-item:hover .micon { color: #F97316; }
  .menu-panel .menu-item.active { background: var(--accent); color: #141410; }
  .menu-panel .menu-item .micon { color: rgba(242, 236, 217, 0.55); }
  .menu-panel .menu-item.active .micon { color: #141410; }
  .menu-panel .side-search input { background: rgba(0, 0, 0, 0.35); border-color: rgba(234, 88, 12, 0.22); color: #F2ECD9; }
  .menu-panel .side-search input::placeholder { color: #6E6A64; }
  .menu-panel .side-search input:focus { background: rgba(0,0,0,.50); }
  .menu-panel .foot-stat { background: rgba(0, 0, 0, 0.32); border-color: rgba(234, 88, 12, 0.18); }
  .menu-panel .foot-stat b { color: #F97316; }
  .menu-panel .foot-stat span { color: #9C9482; }
  .menu-panel .side-data { border-top-color: rgba(234, 88, 12, 0.10); }
  .menu-panel .sd-note { color: #8A8072; }
  .menu-panel .sd-note b { color: #C9C2AE; }
  .menu-panel .sd-row .m-btn { color: #C9C2AE; background: rgba(234, 88, 12, 0.06); border-color: rgba(234, 88, 12, 0.30); }
  .menu-panel .sd-row .m-btn:hover { color: #F97316; background: rgba(234, 88, 12, 0.18); }
  .menu-panel .side-ver { color: #6E6A64; border-top-color: rgba(234, 88, 12, 0.10); }
  .menu-panel .side-ver .ver-txt b { color: #C9C2AE; }
  .menu-panel .ver-btn { color: #C9C2AE; border-color: rgba(234, 88, 12, 0.30); }
  .menu-panel .ver-btn:hover { color: #F97316; }
  .menu-panel .qk-hint { color: #9C9482; }
  .menu-panel .qk-hint:hover { background: rgba(234, 88, 12, 0.10); color: #F97316; }


  .side-search { flex: none; margin: 2px var(--pad) 14px; position: relative; }
  .side-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-3); pointer-events: none; }
  .side-search input { width: 100%; box-sizing: border-box; border: 1px solid rgba(234,88,12,.22);
    background: rgba(0, 0, 0, 0.35); border-radius: 999px; padding: 9px 14px 9px 34px; font-size: 13px; color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s, background .15s; }
  .side-search input::placeholder { color: var(--text-3); }
  .side-search input:focus { border-color: var(--accent); background: rgba(0,0,0,.45); box-shadow: 0 0 0 3px var(--accent-ring); }
  .qk-hint { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: inherit; cursor: pointer;
    background: rgba(242,236,217,.05); border: 1px solid rgba(242,236,217,.12); border-radius: 6px; padding: 1px 7px; font-size: 11px;
    color: var(--text-3); line-height: 1.5; user-select: none; transition: background .15s, color .15s; }
  .qk-hint:hover { background: var(--accent-soft); color: var(--accent); }

  .side-label { flex: none; padding: 0 var(--pad) 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); opacity: .85; }

  .side-foot { flex: none; margin: 12px var(--pad) var(--pad); display: flex; gap: 8px; }
  .foot-stat {
    flex: 1; background: rgba(0, 0, 0, 0.32);
    border: 1px solid rgba(234, 88, 12, 0.18);
    border-radius: 12px; padding: 9px 6px; text-align: center;
  }
  .foot-stat b { display: block; font-size: 17px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .foot-stat span { font-size: 10px; color: var(--text-2); }

  .st-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 9px; }

  /* === 侧栏数据管理（导出 / 导入，跨设备同步兜底） === */
  .side-data { flex: none; margin: 14px var(--pad) 0; padding-top: 12px; border-top: 1px solid rgba(234, 88, 12, 0.10); }
  .sd-row { display: flex; gap: 8px; }
  .sd-row .m-btn { flex: 1; justify-content: center; border: 1px solid rgba(234, 88, 12, 0.30); background: rgba(234, 88, 12, 0.06); }
  .sd-note { font-size: 10.5px; color: var(--text-3); margin-top: 7px; line-height: 1.45; }
  .sd-note b { color: var(--text-2); font-weight: 600; }

  /* === 侧栏底部版本戳（确认线上是否最新 + 手动强制刷新） === */
  .side-ver {
    flex: none; margin: 10px var(--pad) 14px; padding-top: 10px;
    border-top: 1px solid rgba(234, 88, 12, 0.10);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; color: var(--text-3);
  }
  .side-ver .ver-txt b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ver-btn { font-family: var(--font); font-size: 10.5px; color: var(--text-3); background: transparent;
    border: 1px solid rgba(234, 88, 12, 0.30); border-radius: 6px; padding: 2px 7px; cursor: pointer; transition: all .15s; }
  .ver-btn:hover { color: var(--accent); border-color: var(--accent-ring); background: var(--accent-soft); }

  .search-empty { text-align: center; color: var(--text-2); font-size: 14px; line-height: 1.7;

    padding: 48px 20px; border: 1px dashed rgba(242,236,217,.14); border-radius: var(--radius-sm); background: rgba(242,236,217,.02); }

  .menu { flex: 1; overflow-y: auto; padding: 4px 6px 8px;
    display: flex; flex-direction: column; gap: 5px; }
  .menu-item { display: flex; align-items: center; gap: 8px; padding: 8px 8px;
    border-radius: var(--radius-sm); cursor: pointer; color: var(--text);
    font-size: 14px; font-weight: 500; white-space: nowrap;
    transition: background .15s ease, color .15s ease; }
  .menu-item:hover { background: rgba(234, 88, 12, 0.10); color: #F97316; }
  .menu-item.active { background: var(--accent); color: #141410; }
  .menu-item .micon { flex: none; width: 17px; height: 17px; display: grid; place-items: center;
    color: var(--text-2); transition: color .15s ease; }
  .menu-item .micon svg { width: 17px; height: 17px; display: block; }
  .menu-item:hover .micon { color: #F97316; }
  .menu-item.active .micon { color: #141410; }

  .detail-head { flex: none; padding: var(--pad); border-bottom: 1px solid rgba(242,236,217,.06); }
  .detail-head h1 { font-size: clamp(15px,1.8vw,18px); font-weight: 700; letter-spacing: -.01em; }
  .detail-head p { color: var(--text-2); font-size: 12px; margin-top: 3px; }
  .detail-body { flex: 1; overflow-y: auto; padding: var(--pad); }

  /* 首页 hero：问候 + 今日快捷入口（彩色渐变卡片） */
  .hero { position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 18px 22px; margin-bottom: 16px; border-radius: var(--radius-sm);
    background:
      radial-gradient(circle at 0% 0%, rgba(124,58,237,.32), transparent 50%),
      radial-gradient(circle at 100% 100%, rgba(14,165,233,.28), transparent 50%),
      linear-gradient(135deg, #1A1A1F 0%, #101014 100%);
    border: 1px solid rgba(234,88,12,.24);
    box-shadow: 0 8px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(234,88,12,.10); }
  .hero::before { content:""; position:absolute; right:-40px; top:-40px; width:140px; height:140px;
    background: radial-gradient(circle, rgba(234,88,12,.18), transparent 70%); border-radius:50%; pointer-events:none; }
  .hero-hi { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.015em; }
  .hero-sub { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
  .hero-quick { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero-label { font-size: 11.5px; color: var(--text-3); margin-right: 2px; }
  .hero-chip { padding: 6px 14px; border-radius: 999px; background: rgba(242,236,217,.07);
    border: 1px solid rgba(234,88,12,.18); font-size: 12.5px; font-weight: 500; color: var(--text);
    font-family: inherit; cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s, color .15s;
    max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-chip:hover { transform: translateY(-1px); border-color: var(--accent); color: var(--accent);
    box-shadow: 0 5px 14px rgba(234,88,12,.14); }
  @media (max-width: 720px) {
    .hero { padding: 14px 16px; gap: 12px; }
    .hero-quick { margin-left: 0; width: 100%; }
  }

  .placeholder-note { color: var(--text-3); font-size: 12px; background: rgba(242,236,217,.05);
    border: 1px dashed rgba(242,236,217,.1); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; }
  .sub { font-size: 13px; font-weight: 600; color: var(--text); margin: 14px 0 8px; }
  .add-row { display: flex; gap: 8px; }
  input, textarea, select { font-family: var(--font); font-size: 15px; color: var(--text);
    border: 1px solid rgba(242,236,217,.1); background: rgba(242,236,217,.06);
    border-radius: var(--radius-sm); padding: 11px 14px; width: 100%; outline: none;
    transition: border-color .2s, box-shadow .2s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  .btn { font-family: var(--font); font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent); border: none; border-radius: var(--radius-sm);
    padding: 11px 18px; cursor: pointer; white-space: nowrap;
    transition: filter .2s, transform .15s; }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.small { padding: 7px 12px; font-size: 13px; }

  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: rgba(242,236,217,.05); border: 1px solid rgba(242,236,217,.06);
    border-radius: 999px; text-decoration: none; color: var(--text);
    font-size: 14px; font-weight: 500; transition: background .2s, transform .15s; }
  .chip:hover { background: #fff; transform: translateY(-1px); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-line); flex: none; }
  .chip .x { color: var(--text-3); font-size: 13px; cursor: pointer; }
  .chip .x:hover { color: var(--up); }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { position: relative; overflow: hidden; background: var(--tone-bg, var(--card-bg));
    border: 1px solid var(--neutral-line); border-radius: var(--radius-sm);
    padding: 14px 16px; border-left: 3px solid var(--tone, #8B5CF6); }
  .kpi .kpi-lbl { color: var(--text-2); font-size: 12px; font-weight: 500; }
  .kpi .kpi-num { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 4px; font-variant-numeric: tabular-nums; color: var(--text); }

  .kpi .kpi-spark { position: absolute; right: 12px; top: 12px; width: 56px; height: 30px; opacity: .75; }

  /* === 7 天活动折线图（chart-card） === */
  .chart-card { background: var(--card-bg); border: 1px solid var(--neutral-line);

  .chart-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .chart-meta { font-size: 11px; color: var(--text-3); }
  .chart-svg { display: block; width: 100%; height: 80px; }

  /* === 8 分类页 mod 卡左侧 tone 彩条 === */
  .mod { border-left: 3px solid var(--tone, var(--accent)); }
  .mod-overview .ov-spark { display: block; width: 100%; height: 36px; margin-top: 10px; }

  /* === 效率提示卡（淡紫底，MoneyFlow Top Category 风） === */
  .tip-card { display: flex; gap: 12px; align-items: center;

  /* === 分类概览 mini 进度条（Budget Overview 风） === */
  .cat-overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 4px; }
  .ov-row { display: flex; gap: 10px; align-items: center; background: var(--card-bg);
    border: 1px solid var(--neutral-line); border-radius: var(--radius-sm);

  .ov-bar { height: 5px; border-radius: 999px; background: rgba(15,23,42,.06); overflow: hidden; }

  .list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px;

  .row .body { flex: 1; min-width: 0; }

  .row .meta { color: var(--text-2); font-size: 13px; margin-top: 2px; }

  .table td.up { color: var(--up); }
  .table td.down { color: var(--down); }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 12px; }
  .shop { background: rgba(242,236,217,.045); border: 1px solid rgba(242,236,217,.05);
    border-radius: 16px; padding: 16px; }
  .shop .name { font-weight: 600; font-size: 15px; }
  .shop .stat { display: flex; justify-content: space-between; margin-top: 10px; color: var(--text-2); font-size: 13px; }
  .shop .stat b { color: var(--text); font-variant-numeric: tabular-nums; }

  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed .item { display: flex; gap: 12px; padding: 12px 14px;
    background: rgba(242,236,217,.045); border: 1px solid rgba(242,236,217,.05); border-radius: 14px; }
  .feed .src { width: 44px; height: 44px; border-radius: 12px; background: rgba(242,236,217,.05);
    color: var(--text-2); display: grid; place-items: center; font-weight: 700; flex: none; }
  .feed .hd { font-size: 15px; font-weight: 500; }
  .feed .mt { color: var(--text-2); font-size: 12px; margin-top: 3px; }

  .todos { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .todo { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: var(--radius-sm); }
  .todo:hover { background: rgba(242,236,217,.03); }
  .check { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--neutral-line);
    cursor: pointer; display: grid; place-items: center; transition: border-color .2s, background .2s; }
  .check.done { background: var(--accent); border-color: var(--accent); }
  .check.done::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; }
  .todo span { flex: 1; font-size: 15px; word-break: break-word; }
  .todo.done span { color: var(--text-3); text-decoration: line-through; }
  .empty { color: var(--text-3); font-size: 14px; padding: 8px 10px; }

  .ai-head { flex: none; padding: var(--pad); border-bottom: 1px solid rgba(242,236,217,.06);
    display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .ai-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--down); box-shadow: 0 0 0 4px rgba(61,146,104,.18); }
  .ai-head .spacer { flex: 1; }
  .ai-msgs { flex: 1; overflow-y: auto; padding: var(--pad); display: flex; flex-direction: column; gap: 10px; }
  .ai-empty { color: var(--text-3); font-size: 14px; text-align: center; margin: auto; line-height: 1.8; padding: 0 8px; }
  .msg { max-width: 90%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap; }
  .msg.u { align-self: flex-end; background: var(--accent); color: #141410; border-bottom-right-radius: 6px; }
  .msg.a { align-self: flex-start; background: rgba(242,236,217,.07); color: var(--text); border: 1px solid rgba(242,236,217,.05); border-bottom-left-radius: 6px; }
  /* AI 回复中的可点击工具卡片 */
  .msg-tools { display: flex; flex-direction: column; gap: 6px; align-self: stretch; max-width: 96%; margin: -4px 0 4px; }
  .tool-chip { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer;
    font-family: var(--font); font-size: 12.5px; color: var(--text); background: rgba(242,236,217,.04);
    border: 1px solid rgba(242,236,217,.08); border-radius: 10px; padding: 6px 8px;
    transition: background .15s, border-color .15s, transform .12s; }
  .tool-chip:hover { background: var(--accent-soft); border-color: var(--accent-ring); transform: translateX(2px); }
  .tool-chip .ico { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff; overflow: hidden; }
  .tool-chip .tc-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-chip .tc-cat { font-size: 10.5px; color: var(--text-3); flex: none; }
  /* 全站搜索结果 */
  .search-sum { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .search-sum b { color: var(--accent); font-weight: 700; }
  .tile mark { background: rgba(234,88,12,.20); color: inherit; border-radius: 3px; padding: 0 1px; }
  .tile-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--text-3); }
  .tm-mod { background: rgba(242,236,217,.05); border-radius: 5px; padding: 1px 5px; }
  .tm-vis { color: var(--accent); }
  .ai-input { flex: none; padding: var(--pad); border-top: 1px solid rgba(242,236,217,.06); display: flex; gap: 8px; }

  /* AI 面板可收起（默认收起，保留悬浮入口，暂不配置 API 时不占空间） */
  .app.ai-collapsed { grid-template-columns: 200px minmax(0,1fr); }
  .app.ai-collapsed .ai-panel { display: none; }
  .ai-fab { position: fixed; right: 22px; bottom: 22px; z-index: 60;
    width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #3388e0); color: #fff;
    box-shadow: 0 10px 28px rgba(234,88,12,.38);

    transition: transform .15s ease, box-shadow .15s ease; }

  .ai-fab svg { width: 26px; height: 26px; }

  @media (max-width: 860px) { .ai-fab { right: 16px; bottom: 16px; width: 50px; height: 50px; } }

  /* === 常用网址模块 === */
  .mod { background: var(--card-bg); border: 1px solid rgba(242,236,217,.06);
    border-radius: var(--radius-sm); overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,.05); }

    border-bottom: 1px solid rgba(242,236,217,.05); user-select: none; }

  .mod-head .m-title { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; flex: 1;
    display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mod-head .m-title > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .mod-head .m-title .count { font-size: 12px; color: var(--text-3); font-weight: 500; }
  .mod-head .m-actions { display: flex; gap: 6px; align-items: center; }
  .m-btn { font-family: var(--font); font-size: 12.5px; font-weight: 500; color: var(--text);

    transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
  .m-btn:hover { background: rgba(242,236,217,.04); border-color: rgba(242,236,217,.12); }
  .m-btn.primary { background: #8B5CF6; color: #fff; border-color: #8B5CF6; }
  .m-btn.primary:hover { background: #7C3AED; border-color: #7C3AED; }
  .m-btn.danger { color: var(--sem-red); }
  .m-btn.danger:hover { background: rgba(176,74,61,.10); border-color: rgba(176,74,61,.25); }
  .m-btn .caret { font-size: 9px; opacity: .6; }
  .m-icon { width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; cursor: pointer; display: grid; place-items: center;
    color: var(--text-2); font-size: 14px; transition: background .15s, color .15s; padding: 0; }
  .m-icon:hover { background: rgba(242,236,217,.05); color: var(--text); }
  .m-icon.active { background: var(--accent-soft); color: var(--accent); }
  .m-menu { position: relative; }
  .m-menu .m-pop { position: absolute; right: 0; top: calc(100% + 4px);
    background: #1A1A1E; border: 1px solid rgba(242,236,217,.12); border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12); min-width: 160px; padding: 4px; z-index: 10; }
  .m-menu .m-pop button { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px;
    background: transparent; border: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--text); }
  .m-menu .m-pop button:hover { background: rgba(242,236,217,.05); }
  .m-menu .m-pop .sep { height: 1px; background: rgba(242,236,217,.06); margin: 4px 0; }
  .m-menu .m-pop .label { font-size: 12px; color: var(--text-3); padding: 6px 10px 2px; }

  .mod-body { padding: 16px; }
  .mod-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .mod-bar .info { font-size: 12px; color: var(--text-2); }
  .mod-bar .info b { color: var(--text); font-weight: 600; }
  .mod-bar .spacer { flex: 1; }
  .mod-bar .sort-btn { font-size: 12px; padding: 5px 10px; }
  .mod-bar .sort-btn .ord { color: var(--text-3); margin-left: 4px; }

  /* === 分类概览面板（模块页顶部，避免太空） === */
  .mod-overview { background: var(--card-bg); border: 1px solid var(--neutral-line);
    border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; }
  .mod-overview .ov-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .mod-overview .ov-head { display: flex; align-items: center; gap: 13px; }
  .mod-overview .ov-ico { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 18px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.25); }
  .mod-overview .ov-ico svg { width: 25px; height: 25px; }
  .mod-overview .ov-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .mod-overview .ov-sub { font-size: 12.5px; color: var(--text-2); margin-top: 3px; max-width: 420px; }
  .mod-overview .ov-stats { display: flex; gap: 30px; }
  .mod-overview .ov-stat { display: flex; flex-direction: column; align-items: flex-start; }
  .mod-overview .ov-stat b { font-size: 23px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; color: var(--text); }
  .mod-overview .ov-stat span { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .mod-overview .ov-bar { height: 8px; border-radius: 999px; background: rgba(242,236,217,.06); overflow: hidden; margin-top: 16px; }
  .mod-overview .ov-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
  .mod-overview .ov-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .mod-overview .ov-quick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .mod-overview .ov-qlabel { font-size: 12px; color: var(--text-3); font-weight: 600; margin-right: 2px; }
  .mod-overview .ov-chip { font-family: var(--font); font-size: 12.5px; font-weight: 500; color: var(--text);
    background: rgba(242,236,217,.04); border: 1px solid rgba(242,236,217,.07); border-radius: 999px; padding: 6px 13px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s; }
  .mod-overview .ov-chip:hover { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent); }
  .m-btn.ghost { background: rgba(242,236,217,.04); border-color: rgba(242,236,217,.08); }
  .m-btn.ghost:hover { background: rgba(242,236,217,.07); border-color: rgba(242,236,217,.14); }

  .bulk-bar { display: none; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--accent-soft); border-radius: 8px; margin-bottom: 12px; font-size: 13.5px; color: var(--accent); }
  .mod-bulk .bulk-bar { display: flex; }
  .bulk-bar .right { margin-left: auto; display: flex; gap: 6px; }
  .bulk-bar b { color: var(--accent); font-weight: 700; }

  .tile-grid { columns: 4; column-gap: var(--gap); }
  .tile-grid > .tile { break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; margin: 0 0 var(--gap); width: 100%; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 10px 12px; background: var(--tile-bg); border: 1px solid rgba(242,236,217,.05);
    border-radius: 8px; text-decoration: none; color: var(--text); text-align: center;
    transition: background .2s, transform .15s, box-shadow .15s, border-color .15s;
    user-select: none; cursor: pointer; min-height: 112px; }
  .tile:hover { background: #fff; transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0,0,0,.13); border-color: rgba(234,88,12,.24); }
  .tile.dragging { opacity: .35; }
  .tile.dragging:hover { transform: none; box-shadow: none; border-color: rgba(242,236,217,.05); }
  .tile.drag-over { border-color: var(--accent); border-style: dashed; }
  .tile.selected { border-color: var(--accent); background: var(--accent-soft); }
  .tile.failed { border-color: rgba(176,74,61,.35); background: rgba(176,74,61,.04); }
  .tile .ico { width: 56px; height: 56px; border-radius: 13px;
    background: #fff; color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 19px;
    flex: none; overflow: hidden; margin-bottom: 8px;
    border: 1px solid rgba(20,20,24,.06);
    box-shadow: 0 2px 6px rgba(0,0,0,.04), inset 0 0 0 1px rgba(255,255,255,.6);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .tile:hover .ico { transform: scale(1.08); box-shadow: 0 8px 20px rgba(20,20,24,.12), inset 0 0 0 1px rgba(255,255,255,.8); border-color: rgba(20,20,24,.12); }
  .tile .ico img { width: 100%; height: 100%; object-fit: contain; border-radius: 11px; padding: 1px; background: #fff; }
  .tile .nm { font-size: 13.5px; font-weight: 500; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .src { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
    background: rgba(242,236,217,.06); color: var(--text-3); margin-top: 6px; letter-spacing: .02em; }
  .tile .src.preset { background: rgba(234,88,12,.12); color: var(--sem-blue); }
  .tile .src.preset.hidden { background: rgba(242,236,217,.05); color: var(--text-3); }
  .tile .bad { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px rgba(176,74,61,.18); }
  .tile .check { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px;
    border-radius: 4px; border: 1.5px solid var(--neutral-line); background: #fff;
    display: none; align-items: center; justify-content: center; cursor: pointer; }
  .mod-bulk .tile .check { display: flex; }
  .mod-bulk .tile.selected .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mod-bulk .tile.selected .check::after { content: "✓"; font-size: 12px; font-weight: 700; }
  .mod-bulk .tile { cursor: pointer; }
  .tile .drag-handle { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px;
    display: none; align-items: center; justify-content: center; cursor: grab; color: var(--text-3);
    opacity: .45; border-radius: 5px; font-size: 13px; line-height: 1; user-select: none; }
  .tile:hover .drag-handle { display: flex; }
  .tile.dragging .drag-handle { display: flex; }
  .tile .row-actions { position: absolute; bottom: 4px; right: 4px; display: none; gap: 2px; }
  .tile:hover .row-actions { display: flex; }
  .tile .row-actions button { width: 22px; height: 22px; border-radius: 5px; border: none;
    background: rgba(26,26,30,.9); color: var(--text-3); cursor: pointer; font-size: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1); display: grid; place-items: center; }
  .tile .row-actions button svg { width: 13px; height: 13px; display: block; }
  .tile .row-actions button:hover { background: #fff; color: var(--text); }
  .tile .row-actions button.danger:hover { color: var(--up); }
  .tile .lk-del { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border: none; border-radius: 5px;
    background: rgba(26,26,30,.92); color: var(--text-3); cursor: pointer; font-size: 11px; display: none;
    align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .tile:hover .lk-del { display: flex; }
  .tile .lk-del:hover { color: var(--up); }
  .drag-handle.mod-handle { position: static; display: inline-flex; opacity: .5; width: 22px; height: 22px; margin-right: 2px; }
  .mod-head:hover .mod-handle, .mod-handle:active { opacity: .9; }
  .mod-edit .tile { cursor: grab; }
  .mod-edit .tile .name-edit { font-size: 13.5px; font-weight: 500; width: 100%;
    border: 1px solid var(--accent); border-radius: 5px; padding: 3px 5px; outline: none;
    background: #fff; text-align: center; }
  .mod-edit .tile .url-edit { font-size: 11px; color: var(--text-2); width: 100%;
    border: 1px solid var(--accent); border-radius: 5px; padding: 2px 5px; outline: none;
    background: #fff; text-align: center; margin-top: 4px; }
  .mod-edit .tile .save-edit { position: absolute; bottom: 4px; right: 4px; font-size: 11px;
    padding: 3px 8px; background: var(--accent); color: #fff; border: none; border-radius: 5px; cursor: pointer; }

  .view-all { display: block; width: 100%; margin-top: 12px; padding: 10px;
    background: var(--accent-soft); border: none; border-radius: 8px;
    color: var(--accent); font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .view-all:hover { background: var(--accent-soft); }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-3); }
  .empty-state .ic { width: 46px; height: 46px; margin: 0 auto 10px; opacity: .5; display: grid; place-items: center; }
  .empty-state .ic svg { width: 100%; height: 100%; }
  .empty-state .tt { font-size: 15px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
  .empty-state .mt { font-size: 13px; }

  .dlg-back { position: fixed; inset: 0; background: rgba(0,0,0,.68);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .dlg { width: 100%; max-width: 420px; background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.22); animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .dlg h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .dlg .sub { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
  .dlg .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .dlg .field label { font-size: 13px; color: var(--text-2); font-weight: 500; }
  .dlg .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  @media (max-width: 1080px) { .tile-grid { columns: 3; } }
  @media (max-width: 720px)  { .tile-grid { columns: 2; } }
  @media (max-width: 860px) {
    body { padding: 12px; }
    .app { grid-template-columns: 1fr; height: auto; min-height: calc(100dvh - 24px - env(safe-area-inset-bottom)); }
    .menu-panel { order: 1; }
    .detail-panel { order: 2; }
    .ai-panel { order: 3; min-height: 60vh; }
    .app.ai-collapsed { grid-template-columns: 1fr; }
    .menu { flex-direction: row; overflow-x: auto; padding: 10px 12px; gap: 8px; -webkit-overflow-scrolling: touch; }
    .menu-item { white-space: nowrap; padding: 10px 14px; }
    .brand { padding: 14px 14px 6px; }
    .side-foot, .side-label, .side-data, .side-ver { display: none; }

/* === 访问密码校验（未通过时锁屏覆盖，屏蔽工作台内容） ===
   修改默认密码：把新密码的 SHA-256 填进 AUTH_HASH 即可（当前默认 wb2026）。 */
(function(){
  var AUTH_KEY = "wb_auth_until";
  var AUTH_HASH = "11d6fb44d7240f4392b9f013ec25dfa2da3f6bd3d7e95416bc356a9ca2d6da70";
  var screenEl = document.getElementById("lockScreen");
  var inputEl  = document.getElementById("lockInput");
  var btnEl    = document.getElementById("lockBtn");
  var errEl    = document.getElementById("lockErr");
  var remEl    = document.getElementById("lockRemember");
  if(!screenEl) return;

  function unlock(){
    screenEl.classList.add("hide");
    document.body.style.overflow = "";
  }
  try {
    var until = parseInt(localStorage.getItem(AUTH_KEY) || "0", 10);
    if(until && Date.now() < until){ unlock(); return; }
  } catch(e){}

  document.body.style.overflow = "hidden";

  /* 无 crypto.subtle 时（个别 file:// 场景）的降级摘要，保证本地双击也能用 */
  function legacy(s){
    var h1 = 0x811c9dc5, h2 = 0x01000193;
    for(var i = 0; i < s.length; i++){
      h1 = ((h1 ^ s.charCodeAt(i)) * h2) >>> 0;
      h2 = ((h2 ^ s.charCodeAt(i)) + i) * 16777619 >>> 0;
    }
    return ("0000000" + h1.toString(16)).slice(-8) + ("0000000" + h2.toString(16)).slice(-8);
  }
  var LEGACY_HASH = legacy("wb2026");

  function digest(str){
    if(window.crypto && crypto.subtle && window.TextEncoder){
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){
          return ("0" + b.toString(16)).slice(-2);
        }).join("");
      }).catch(function(){ return legacy(str); });
    }
    return Promise.resolve(legacy(str));
  }

  function submit(){
    var val = inputEl.value || "";
    if(!val){ errEl.textContent = "请输入密码"; return; }
    digest(val).then(function(h){
      if(h === AUTH_HASH || h === LEGACY_HASH){
        if(remEl.checked){
          try { localStorage.setItem(AUTH_KEY, String(Date.now() + 30 * 24 * 3600 * 1000)); } catch(e){}
        }
        errEl.textContent = "";
        unlock();
      } else {
        errEl.textContent = "密码不正确";
        inputEl.value = "";
        inputEl.focus();
      }
    });
  }
  btnEl.onclick = submit;
  inputEl.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
  inputEl.focus();
})();

function createIcon(name, url, cls, pageId){
  const ico = document.createElement("div");
  ico.className = cls || "ico";

  /* 表单与数据审核页：所有 tile 一律强制色块+首字母，不加载任何图片/favicon（飞书通用 favicon 丑且重复） */
  if(pageId === "forms"){
    ico.style.background = gradFromName(name);
    ico.textContent = firstChar(name);
    return ico;
  }

  /* 自定义图标：直接渲染本地图片，跳过首字母与 favicon 抓取。加载失败回退首字母 */
  const overrideSrc = ICON_OVERRIDES[name];
  if(overrideSrc && overrideSrc !== ""){
    const img = document.createElement("img");
    img.alt = "";
    img.decoding = "async";
    img.loading = "lazy";
    img.onerror = function(){
      /* 原站 favicon.ico 失败 → 回退 Google（国际源，国内可能不稳）→ 首字母 */
      if(!img.dataset.tried){
        img.dataset.tried = "1";
        const dm = domainFromUrl(url);
        if(dm){ img.src = "https://www.google.com/s2/favicons?domain=" + dm + "&sz=128"; return; }
      }
      img.remove();
      ico.style.background = gradFromName(name);
      ico.textContent = firstChar(name);
    };
    img.onload = function(){
      if(img.naturalWidth >= 8 && img.naturalHeight >= 8){
        /* 成功：什么都不做，ico 本来就是空的，img 作为唯一子元素自然显示 */
      } else {
        img.remove();
        ico.style.background = gradFromName(name);
        ico.textContent = firstChar(name);
      }
    };
    img.src = overrideSrc;
    ico.appendChild(img);
    return ico;
  }

  /* overrideSrc === "" 表示「强制色块模式」：直接显示渐变色块+首字母，不加载任何图片/favicon */
  if(overrideSrc === ""){
    ico.style.background = gradFromName(name);
    ico.textContent = firstChar(name);
    return ico;
  }

  ico.style.background = gradFromName(name);
  ico.textContent = firstChar(name);
  const domain = domainFromUrl(url);
  if(!domain) return ico;

  // 多源 favicon 回退：DuckDuckGo → Google → 原站 favicon.ico，都失败则保留首字母
  const srcs = [
    "https://icons.duckduckgo.com/ip3/" + encodeURIComponent(domain) + ".ico",
    "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(domain) + "&sz=128",
    "https://" + domain + "/favicon.ico"
  ];
  const img = document.createElement("img");
  img.alt = "";
  img.decoding = "async";
  img.loading = "lazy";
  let idx = 0;
  img.onerror = function(){
    idx++;
    if(idx < srcs.length){ img.src = srcs[idx]; }
    else { img.remove(); }
  };
  img.onload = function(){
    if(img.naturalWidth >= 8 && img.naturalHeight >= 8){
      /* 成功：只移除文字节点（兜底字母），保留 img */
      [...ico.childNodes].forEach(n => { if(n.nodeType === 3) n.remove(); });
    } else {
      idx++;
      if(idx < srcs.length){ img.src = srcs[idx]; }
      else { img.remove(); }
    }
  };
  // 网络静默失败兜底：4 秒后仍未加载成功则移除
  setTimeout(function(){
    if(img.parentNode && (!img.naturalWidth || img.naturalWidth < 8)) img.remove();
  }, 4000);
  img.src = srcs[idx];
  ico.appendChild(img);
  return ico;
}

function buildTile(l, state){
  const a = document.createElement("div");
  a.setAttribute("role", "button");
  a.setAttribute("tabindex", "0");
  a.className = "tile" + (l.selected ? " selected" : "") + (l.failed ? " failed" : "");
  a.dataset.id = l.id;
  a.draggable = false; // 拖拽改由专门的 drag-handle 触发，避免 draggable=true 吞掉 click（桌面端点击不灵敏/点不动）

  const ico = createIcon(l.name, l.url, "ico");

  const body = document.createElement("div");
  body.className = "body";

  if(state.edit && l.source === "user"){
    const ni = document.createElement("input");
    ni.className = "name-edit"; ni.value = l.name; ni.maxLength = 40;
    const ui = document.createElement("input");
    ui.className = "url-edit"; ui.value = l.url;
    body.append(ni, ui);
    ico.style.display = "none";
    a.draggable = false;
    const saveBtn = document.createElement("button");
    saveBtn.className = "save-edit"; saveBtn.textContent = "保存";
    saveBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation();
      const n = ni.value.trim() || l.name;
      const u = ui.value.trim() || l.url;
      l.name = n; l.url = u; l.failed = false;
      state.edit = false; saveUi(state); persistAndRender();
    };
    a.appendChild(saveBtn);
  } else {
    const nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = l.name;
    const src = document.createElement("span");
    src.className = "src " + (l.source === "preset" ? "preset" : "") + (l.hidden ? " hidden" : "");
    src.textContent = l.source === "preset" ? (l.hidden ? "企业·已隐藏" : "企业预置") : "个人";
    body.append(nm, src);
  }
  a.append(ico, body);

  if(l.failed){
    const bad = document.createElement("div"); bad.className = "bad"; bad.title = "已标记失效";
    a.appendChild(bad);
  }

  if(!state.edit && !state.bulk && l.source === "user"){
    const acts = document.createElement("div"); acts.className = "row-actions";
    const edit = document.createElement("button"); edit.textContent = "✎"; edit.title = "编辑";
    edit.onclick = (e) => { e.preventDefault(); e.stopPropagation(); state.edit = true; saveUi(state); renderCommon(); };
    const fail = document.createElement("button");
    fail.textContent = l.failed ? "↻" : "⚠"; fail.title = l.failed ? "恢复正常" : "标记失效";
    if(!l.failed) fail.className = "danger";
    fail.onclick = (e) => { e.preventDefault(); e.stopPropagation(); l.failed = !l.failed; persist(); renderCommon(); };
    const del = document.createElement("button"); del.textContent = "✕"; del.title = "删除"; del.className = "danger";
    del.onclick = (e) => { e.preventDefault(); e.stopPropagation();
      if(confirm("删除「" + l.name + "」？")){
        const i = allLinks.findIndex(x => x.id === l.id);
        if(i >= 0){ allLinks.splice(i, 1); persist(); renderCommon(); }
      }
    };
    acts.append(edit, fail, del);
    a.appendChild(acts);
  } else if(!state.edit && !state.bulk && l.source === "preset"){
    const acts = document.createElement("div"); acts.className = "row-actions";
    const hide = document.createElement("button");
    hide.innerHTML = l.hidden
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>';
    hide.title = l.hidden ? "取消隐藏" : "隐藏";
    hide.onclick = (e) => { e.preventDefault(); e.stopPropagation(); l.hidden = !l.hidden; persist(); renderCommon(); };
    const fail = document.createElement("button");
    fail.textContent = l.failed ? "↻" : "⚠"; fail.title = l.failed ? "恢复正常" : "标记失效";
    if(!l.failed) fail.className = "danger";
    fail.onclick = (e) => { e.preventDefault(); e.stopPropagation(); l.failed = !l.failed; persist(); renderCommon(); };
    acts.append(hide, fail);
    a.appendChild(acts);
  }

  // 拖拽手柄：仅此元素 draggable，磁贴本体保持可点击，彻底解决 draggable 吞 click 的问题
  if(!state.bulk && !state.edit){
    const handle = document.createElement("div");
    handle.className = "drag-handle";
    handle.setAttribute("draggable", "true");
    handle.title = "拖拽排序";
    handle.textContent = "⠿";
    handle.addEventListener("click", (e) => e.stopPropagation());
    handle.addEventListener("dragstart", (e) => {
      e.stopPropagation();
      e.dataTransfer.setData("text/plain", l.id);
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setDragImage(a, 24, 24); } catch(_) {}
      a.classList.add("dragging");
    });
    handle.addEventListener("dragend", () => a.classList.remove("dragging"));
    a.appendChild(handle);
  }

  if(!state.edit){
    if(state.bulk){
      const ck = document.createElement("div"); ck.className = "check";
      if(l.selected) a.classList.add("selected");
      ck.onclick = (e) => { e.preventDefault(); l.selected = !l.selected; a.classList.toggle("selected"); updateBulkBar(); };
      a.appendChild(ck);
      a.addEventListener("click", (e) => { e.preventDefault(); ck.click(); });
    } else {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openLink(l.url);
        l.visits = (l.visits || 0) + 1;
        persist();
      });
    }
  }

  a.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; a.classList.add("drag-over"); });
  a.addEventListener("dragleave", () => a.classList.remove("drag-over"));
  a.addEventListener("drop", (e) => {
    e.preventDefault(); a.classList.remove("drag-over");
    const srcId = e.dataTransfer.getData("text/plain");
    if(!srcId || srcId === l.id) return;
    const srcIdx = allLinks.findIndex(x => x.id === srcId);
    const dstIdx = allLinks.findIndex(x => x.id === l.id);
    if(srcIdx < 0 || dstIdx < 0) return;
    const [moved] = allLinks.splice(srcIdx, 1);
    allLinks.splice(dstIdx, 0, moved);
    state.sort = "manual";
    persist();
    renderCommon();
  });

  return a;
}

let allLinks = [];
function persist(){ save(STATE_KEY, allLinks); }
function persistAndRender(){ persist(); renderCommon(); }

function applySort(list, sort){
  if(sort === "manual") return list;
  if(sort === "visits") return [...list].sort((a,b) => (b.visits||0) - (a.visits||0));
  return list;
}
function applyFilter(list, state){
  let ls = list;
  if(!state.showHidden) ls = ls.filter(l => !l.hidden);
  if(state.query){
    const q = state.query.toLowerCase();
    ls = ls.filter(l => (l.name+" "+l.url).toLowerCase().includes(q));
  }
  return ls;
}

function updateBulkBar(){
  const bar = $("bulkBar");
  if(!bar) return;
  const sel = allLinks.filter(l => l.selected).length;
  $("bulkCount").textContent = sel;
  $("bulkDel").disabled = false;
}

function renderCommon(){
  const state = loadUi();
  const root = $("commonMod");
  if(!root) return;
  root.classList.toggle("mod-collapsed", !!state.collapsed);
  root.classList.toggle("mod-bulk", !!state.bulk);
  root.classList.toggle("mod-edit", !!state.edit);

  $("sortLabel").textContent = state.sort === "manual" ? "手动" : "按访问频次";
  $("sortOrd").textContent = state.sort === "manual" ? "拖拽" : "高→低";

  const visible = applyFilter(applySort(allLinks, state.sort), state);
  const total = allLinks.length;
  const shown = visible.length;
  const hiddenCount = allLinks.filter(l => l.hidden).length;

  $("modInfo").innerHTML = `共 <b>${total}</b> 个，已显示 <b>${shown}</b>${hiddenCount ? `，隐藏 <b>${hiddenCount}</b>` : ""}`;

  const grid = $("tileGrid");
  grid.innerHTML = "";

  if(allLinks.length === 0){
    const e = document.createElement("div");
    e.className = "empty-state";
    e.innerHTML = '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div><div class="tt">还没有任何链接</div><div class="mt">点击右上角「添加链接」开始</div>';
    grid.appendChild(e);
    $("viewAll").style.display = "none";
    updateBulkBar();
    return;
  }

  if(visible.length === 0){
    const e = document.createElement("div");
    e.className = "empty-state";
    e.innerHTML = state.showHidden
      ? '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="tt">没有可显示的链接</div><div class="mt">试试清除筛选或关闭「显示已隐藏」</div>'
      : '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="tt">没有匹配的链接</div><div class="mt">试试调整搜索关键词</div>';
    grid.appendChild(e);
    $("viewAll").style.display = "none";
    updateBulkBar();
    return;
  }

  const MAX_INLINE = 16;
  const renderList = state.showHidden ? visible : visible.slice(0, MAX_INLINE);
  renderList.forEach(l => grid.appendChild(buildTile(l, state)));

  const more = visible.length - renderList.length;
  const va = $("viewAll");
  if(more > 0){
    va.style.display = "block";
    va.textContent = `查看全部（还有 ${more} 个）`;
    va.onclick = () => { state.showHidden = true; saveUi(state); renderCommon(); };
  } else if(!state.showHidden && visible.length >= MAX_INLINE){
    va.style.display = "block";
    va.textContent = "已显示全部";
    va.onclick = null;
  } else {
    va.style.display = "none";
  }

  updateBulkBar();
}

function openDialog(link){
  const isEdit = !!link;
  const back = document.createElement("div");
  back.className = "dlg-back";
  back.innerHTML =
    '<div class="dlg" role="dialog" aria-modal="true">' +
      '<h3>' + (isEdit ? "编辑链接" : "添加链接") + '</h3>' +
      '<div class="sub">预置链接不可编辑 / 删除；如不需要可隐藏。</div>' +
      '<div class="field"><label>名称</label><input id="dlgN" maxlength="40" placeholder="如：邮箱"/></div>' +
      '<div class="field"><label>网址</label><input id="dlgU" placeholder="如：mail.qq.com（无需带 https://）"/></div>' +
      '<div class="actions">' +
        '<button class="m-btn" id="dlgCancel">取消</button>' +
        '<button class="m-btn primary" id="dlgOk">' + (isEdit ? "保存" : "添加") + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(back);
  const ni = back.querySelector("#dlgN"), ui = back.querySelector("#dlgU");
  ni.value = link ? link.name : "";
  ui.value = link ? link.url : "";
  setTimeout(() => ni.focus(), 30);

  const close = () => back.remove();
  back.addEventListener("click", (e) => { if(e.target === back) close(); });
  back.querySelector("#dlgCancel").onclick = close;
  const submit = () => {
    const n = ni.value.trim(), u = ui.value.trim();
    if(!n){ ni.focus(); return; }
    if(!u){ ui.focus(); return; }
    if(link){
      link.name = n; link.url = u; link.failed = false;
    } else {
      allLinks.push({ id:"u_" + Date.now(), name:n, url:u, source:"user",
        hidden:false, visits:0, failed:false });
    }
    persist(); renderCommon(); close();
  };
  back.querySelector("#dlgOk").onclick = submit;
  [ni, ui].forEach(inp => inp.addEventListener("keydown", e => {
    if(e.key === "Enter") submit();
    if(e.key === "Escape") close();
  }));
  back.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
}

function greetByHour(h){
  if(h < 6)  return "夜深了";
  if(h < 11) return "早上好";
  if(h < 14) return "中午好";
  if(h < 18) return "下午好";
  return "晚上好";
}
/* 首页 hero：按时间问候 + 日期 + 链接总数 + 最近常用快捷入口（取访问频次 top4） */
function buildHero(){
  const d = new Date();
  const week = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];
  const dateStr = d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + week;
  const vis   = allLinks.filter(l => !l.hidden);
  const used  = vis.filter(l => (l.visits||0) > 0).sort((a,b) => (b.visits||0) - (a.visits||0));
  const quick = (used.length ? used : vis).slice(0, 4);

  const hero = document.createElement("div");
  hero.className = "hero";
  const left = document.createElement("div");
  left.innerHTML = '<div class="hero-hi">' + greetByHour(d.getHours()) + '</div>'
                 + '<div class="hero-sub">' + dateStr + ' · 共 ' + vis.length + ' 个链接</div>';
  hero.appendChild(left);

  if(quick.length){
    const box = document.createElement("div");
    box.className = "hero-quick";
    const lab = document.createElement("span");
    lab.className = "hero-label";
    lab.textContent = used.length ? "最近常用" : "快速开始";
    box.appendChild(lab);
    quick.forEach(l => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "hero-chip";
      chip.textContent = l.name;
      chip.title = l.name + " · " + l.url;
      chip.onclick = () => { l.visits = (l.visits || 0) + 1; persist(); openLink(l.url); };
      box.appendChild(chip);
    });
    hero.appendChild(box);
  }
  return hero;
}

  search.value = state.query || "";
  search.oninput = () => { state.query = search.value; saveUi(state); renderCommon(); };

  card.querySelector("#bulkHide").onclick = () => {
    allLinks.forEach(l => { if(l.selected) l.hidden = true; l.selected = false; });
    persist(); renderCommon();
  };
  card.querySelector("#bulkUnhide").onclick = () => {
    allLinks.forEach(l => { if(l.selected) l.hidden = false; l.selected = false; });
    persist(); renderCommon();
  };
  card.querySelector("#bulkDel").onclick = () => {
    const targets = allLinks.filter(l => l.selected);
    const blocked = targets.filter(l => l.source === "preset");
    const ok = targets.filter(l => l.source === "user");
    if(blocked.length && !ok.length){ alert("预置链接不可删除，可以「隐藏」。"); return; }
    if(!ok.length) return;
    if(!confirm("删除选中的 " + ok.length + " 个链接？")) return;
    allLinks = allLinks.filter(l => !(l.selected && l.source === "user"));
    persist(); renderCommon();
  };
  card.querySelector("#bulkExit").onclick = () => {
    state.bulk = false; allLinks.forEach(l => l.selected = false);
    saveUi(state); renderCommon();
  };

  renderCommon();
}

function loadModules(pageId){
  let m = modulesOf(pageId);
  if(!m){ m = defaultModules(pageId); saveModules(pageId, m); }
  return m;
}

/* 点击频次记录：打开链接时累加 visits，用于智能排序与快开推荐 */
function recordVisit(url){
  const u = (url || "").trim();
  if(!u) return;
  const nu = normalizeUrl(u);
  const all = load(MODS_KEY, {});
  let changed = false;
  CATS.filter(c => !c.home).forEach(c => {
    const entry = all[c.id];
    if(!entry || !entry.modules) return;
    entry.modules.forEach(m => (m.links || []).forEach(l => {
      if(l.url && normalizeUrl(l.url) === nu){ l.visits = (l.visits || 0) + 1; changed = true; }
    }));
  });
  if(changed) save(MODS_KEY, all);
}

/* 模块内排序模式：frequent（常用优先，按 visits 降序）/ manual（手动拖拽顺序） */
const SORT_KEY = "wb_mod_sort";
function getSortMode(){ return load(SORT_KEY, "frequent"); }
function setSortMode(v){ save(SORT_KEY, v); }

function renderModules(root, pageId){
  const c = CATS.find(x => x.id === pageId) || null;
  let modules = loadModules(pageId);

  function paint(){
    modules = loadModules(pageId);
    root.innerHTML = "";

    if(c){
      const totalLinks = modules.reduce((s, m) => s + (m.links ? m.links.length : 0), 0);
      let allTotal = 0; CATS.filter(x => !x.home).forEach(x => { allTotal += menuCount(x); });
      const pct = allTotal ? Math.round(totalLinks / allTotal * 100) : 0;
      const topLinks = []; modules.forEach(m => (m.links || []).forEach(l => topLinks.push(l)));
      const ov = document.createElement("div"); ov.className = "mod-overview";
      ov.innerHTML =
        '<div class="ov-top">' +
          '<div class="ov-head"><div class="ov-ico" style="background:linear-gradient(135deg,' + c.tone + ',' + shade(c.tone, 18) + ')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + c.icon + '</svg></div>' +
            '<div><div class="ov-title">' + esc(c.label) + ' · 模块视图</div>' +
            '<div class="ov-sub">' + esc(MODULES[pageId].desc) + '</div></div></div>' +
          '<div class="ov-stats">' +
            '<div class="ov-stat"><b>' + modules.length + '</b><span>模块</span></div>' +
            '<div class="ov-stat"><b>' + totalLinks + '</b><span>链接</span></div>' +
            '<div class="ov-stat"><b>' + pct + '%</b><span>占全站</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="ov-bar"><div class="ov-fill" style="width:' + pct + '%;background:linear-gradient(90deg,' + c.tone + ',' + shade(c.tone, 18) + ')"></div></div>' +
        '<div class="ov-acts">' +
          '<button class="m-btn primary" data-act="mod">＋ 添加模块</button>' +
          '<button class="m-btn" data-act="link"' + (modules.length ? '' : ' disabled style="opacity:.5;cursor:not-allowed"') + '>＋ 添加链接</button>' +
          '<button class="m-btn ' + (getSortMode() === "frequent" ? "active" : "") + '" data-act="sort" title="按点击频次把常用工具置顶；关闭则恢复手动顺序">' + (getSortMode() === "frequent" ? "常用优先 ✓" : "常用优先") + '</button>' +
          '<button class="m-btn ghost" data-act="home">回到首页</button>' +
        '</div>' +
        (topLinks.length ? '<div class="ov-quick"><span class="ov-qlabel">快捷入口</span>' +
          topLinks.slice(0, 10).map(l => '<button class="ov-chip" type="button">' + esc(l.name) + '</button>').join('') + '</div>' : '');
      ov.querySelector('[data-act="mod"]').onclick = () => openModuleDialog(pageId, null);
      const lb = ov.querySelector('[data-act="link"]');
      if(modules.length) lb.onclick = () => openLinkDialog(pageId, modules[0].id, null);
      ov.querySelector('[data-act="sort"]').onclick = () => { setSortMode(getSortMode() === "frequent" ? "manual" : "frequent"); paint(); };
      ov.querySelector('[data-act="home"]').onclick = () => selectCat("home");
      ov.querySelectorAll(".ov-chip").forEach((ch, i) => { ch.onclick = () => openLink(topLinks[i].url); });
      root.appendChild(ov);
    }

    const wrap = document.createElement("div"); wrap.id = "modsWrap"; root.appendChild(wrap);

    if(!modules.length){
      wrap.innerHTML = '<div class="empty-state"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="tt">还没有模块</div><div class="mt">点上方「＋ 添加模块」开始整理你的链接</div></div>';
      return;
    }
    modules.forEach((m, mi) => wrap.appendChild(buildModuleCard(m, mi)));
    wrap.querySelectorAll(".tile").forEach((t, i) => { t.style.animationDelay = Math.min(i * 0.025, 0.4) + "s"; });
  }

  function buildModuleCard(m, mi){
    const _cat = CATS.find(function(x){ return x.id === pageId; });
    const _ct = _cat ? _cat.tone : "#8B5CF6";
    const card = document.createElement("div");
    card.className = "mod" + (m.collapsed ? " mod-collapsed" : "");
    card.dataset.id = m.id;
    card.style.setProperty("--tone", _ct);
    const head = document.createElement("div"); head.className = "mod-head";

    const mh = document.createElement("div"); mh.className = "drag-handle mod-handle";
    mh.setAttribute("draggable", "true"); mh.textContent = "⠿"; mh.title = "拖拽排序模块";
    mh.addEventListener("click", e => e.stopPropagation());
    mh.addEventListener("dragstart", e => { e.stopPropagation(); e.dataTransfer.setData("text/plain", "M:"+m.id); e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setDragImage(card, 20, 20); }catch(_){} card.classList.add("dragging"); });
    mh.addEventListener("dragend", () => card.classList.remove("dragging"));

    const title = document.createElement("div"); title.className = "m-title";
    const tspan = document.createElement("span"); tspan.textContent = m.title; tspan.style.cursor = "text"; tspan.title = "点击重命名";
    tspan.onclick = () => { const nv = prompt("模块名称", m.title); if(nv && nv.trim()){ m.title = nv.trim(); saveModules(pageId, modules); paint(); } };
    const cnt = document.createElement("span"); cnt.className = "count"; cnt.textContent = " · " + (m.links ? m.links.length : 0);
    title.append(tspan, cnt);

    const acts = document.createElement("div"); acts.className = "m-actions";
    const addLink = document.createElement("button"); addLink.className = "m-btn"; addLink.textContent = "＋ 链接"; addLink.onclick = () => openLinkDialog(pageId, m.id, null);
    const fold = document.createElement("button"); fold.className = "m-icon"; fold.textContent = "▾"; fold.title = "折叠 / 展开";
    fold.onclick = () => { m.collapsed = !m.collapsed; saveModules(pageId, modules); card.classList.toggle("mod-collapsed", m.collapsed); };
    const del = document.createElement("button"); del.className = "m-icon"; del.title = "删除模块";
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
    del.onclick = () => { if(confirm("删除模块「"+m.title+"」及其 "+(m.links?m.links.length:0)+" 个链接？")){ const i = modules.findIndex(x=>x.id===m.id); if(i>=0){ modules.splice(i,1); saveModules(pageId, modules); paint(); } } };
    acts.append(addLink, fold, del);
    head.append(mh, title, acts);
    card.appendChild(head);

    const body = document.createElement("div"); body.className = "mod-body";
    const sortMode = getSortMode();
    const links = (m.links || []).slice();
    if(sortMode === "frequent") links.sort((a, b) => (b.visits || 0) - (a.visits || 0));
    if(links.length){
      const grid = document.createElement("div"); grid.className = "tile-grid";
      links.forEach(lk => grid.appendChild(buildLinkTile(lk, m, sortMode, pageId)));
      body.appendChild(grid);
    } else {
      body.innerHTML = '<div class="empty" style="padding:18px 0;color:var(--text-3);font-size:13px;">暂无链接，点「＋ 链接」添加</div>';
    }
    card.appendChild(body);

    card.addEventListener("dragover", e => { if(e.dataTransfer.getData("text/plain").startsWith("M:")){ e.preventDefault(); card.classList.add("drag-over"); } });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", e => {
      const data = e.dataTransfer.getData("text/plain");
      if(!data.startsWith("M:")) return;
      e.preventDefault(); card.classList.remove("drag-over");
      const srcId = data.slice(2); const srcIdx = modules.findIndex(x=>x.id===srcId); const dstIdx = modules.findIndex(x=>x.id===m.id);
      if(srcIdx>=0 && dstIdx>=0 && srcIdx!==dstIdx){ const [mv] = modules.splice(srcIdx,1); modules.splice(dstIdx,0,mv); saveModules(pageId, modules); paint(); }
    });
    return card;
  }

  function buildLinkTile(lk, m, sortMode, pageId){
    const a = document.createElement("div"); a.className = "tile"; a.setAttribute("role","button"); a.tabIndex = 0; a.draggable = false; a.style.cursor = "pointer"; a.dataset.id = lk.id;
    const ico = createIcon(lk.name, lk.url, "ico", pageId);
    const b = document.createElement("div"); b.className = "body";
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = lk.name;
    b.appendChild(nm); a.append(ico, b);

    const frequent = sortMode === "frequent";
    if(frequent && (lk.visits || 0) > 0){
      const vb = document.createElement("span"); vb.className = "vis-badge"; vb.textContent = "用 " + lk.visits; a.appendChild(vb);
    }

    if(!frequent){
      const h = document.createElement("div"); h.className = "drag-handle"; h.setAttribute("draggable","true"); h.textContent = "⠿"; h.title = "拖拽排序";
      h.addEventListener("click", e => e.stopPropagation());
      h.addEventListener("dragstart", e => { e.stopPropagation(); e.dataTransfer.setData("text/plain","L:"+lk.id); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setDragImage(a,20,20); }catch(_){} a.classList.add("dragging"); });
      h.addEventListener("dragend", () => a.classList.remove("dragging"));
      a.appendChild(h);
    }

    const del = document.createElement("button"); del.className = "lk-del"; del.textContent = "✕"; del.title = "删除";
    del.onclick = (e) => { e.stopPropagation(); if(confirm("删除「"+lk.name+"」？")){ const i = m.links.findIndex(x=>x.id===lk.id); if(i>=0){ m.links.splice(i,1); saveModules(pageId, modules); paint(); } } };
    a.appendChild(del);

    a.addEventListener("click", e => { e.preventDefault(); openLink(lk.url); });
    a.addEventListener("dragover", e => { if(e.dataTransfer.getData("text/plain").startsWith("L:")){ e.preventDefault(); a.classList.add("drag-over"); } });
    a.addEventListener("dragleave", () => a.classList.remove("drag-over"));
    a.addEventListener("drop", e => {
      const data = e.dataTransfer.getData("text/plain");
      if(!data.startsWith("L:")) return;
      e.preventDefault(); a.classList.remove("drag-over");
      const srcId = data.slice(2); const srcIdx = m.links.findIndex(x=>x.id===srcId); const dstIdx = m.links.findIndex(x=>x.id===lk.id);
      if(srcIdx>=0 && dstIdx>=0 && srcIdx!==dstIdx){ const [mv] = m.links.splice(srcIdx,1); m.links.splice(dstIdx,0,mv); saveModules(pageId, modules); paint(); }
    });
    return a;
  }

  paint();
}

    '<div class="placeholder-note">个人待办 · 勾选完成、删除、添加，存于本地。</div>' +
    '<ul class="todos" id="lfList"></ul>' +

  const box = root.querySelector("#lfList");
  function paint(){ box.innerHTML="";
    if(!arr.length){ box.innerHTML='<div class="empty">暂无事项，添加一个吧。</div>'; return; }
    arr.forEach((td,i)=>{ const li=document.createElement("li");li.className="todo"+(td.done?" done":"");
      const c=document.createElement("div");c.className="check"+(td.done?" done":"");c.dataset.i=i;
      const s=document.createElement("span");s.textContent=td.t;
      const d=document.createElement("div");d.className="del";d.dataset.i=i;d.textContent="✕";
      c.onclick=()=>{arr[i].done=!arr[i].done;save("wb_life",arr);paint();};
      d.onclick=()=>{arr.splice(i,1);save("wb_life",arr);paint();};
      li.append(c,s,d); box.appendChild(li);
    });
  }
  const add=()=>{ const v=root.querySelector("#lfInput").value.trim(); if(!v) return; arr.push({t:v,done:false}); save("wb_life",arr); root.querySelector("#lfInput").value=""; paint(); };
  root.querySelector("#lfAdd").onclick=add;
  root.querySelector("#lfInput").addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });

}

/* 首页 hero：天气（Open-Meteo 免密钥，失败回退示例值） */
function weatherIcon(kind){
  const S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  const map = {
    sun:   S + '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    partly: S + '<circle cx="8" cy="8" r="3.2"/><path d="M8 2.6v1.5M2.6 8H4.1M3.7 3.7l1 1M12.4 3.7l-1 1"/><path d="M7 18a4 4 0 0 1 .4-8 5 5 0 0 1 9.4 1.4A3.6 3.6 0 0 1 16.5 18z"/></svg>',
    cloud: S + '<path d="M7 18a4 4 0 0 1 .4-8 5 5 0 0 1 9.4 1.4A3.6 3.6 0 0 1 16.5 18z"/></svg>',
    rain:  S + '<path d="M7 15a4 4 0 0 1 .4-8 5 5 0 0 1 9.4 1.4A3.6 3.6 0 0 1 16.5 15z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/></svg>',
    snow:  S + '<path d="M7 15a4 4 0 0 1 .4-8 5 5 0 0 1 9.4 1.4A3.6 3.6 0 0 1 16.5 15z"/><path d="M9 18v2M12 18v2M15 18v2"/></svg>',
    storm: S + '<path d="M7 15a4 4 0 0 1 .4-8 5 5 0 0 1 9.4 1.4A3.6 3.6 0 0 1 16.5 15z"/><path d="M12 13l-2 4h3l-2 4"/></svg>'
  };
  return map[kind] || map.partly;
}
function wmoWeather(code){
  if(code === 0) return { kind:"sun", desc:"晴" };
  if(code === 1) return { kind:"sun", desc:"大致晴朗" };
  if(code === 2) return { kind:"partly", desc:"局部多云" };
  if(code === 3) return { kind:"cloud", desc:"阴" };
  if(code === 45 || code === 48) return { kind:"cloud", desc:"雾" };
  if(code >= 51 && code <= 55) return { kind:"rain", desc:"毛毛雨" };
  if(code >= 61 && code <= 65) return { kind:"rain", desc:"雨" };
  if(code >= 71 && code <= 75) return { kind:"snow", desc:"雪" };
  if(code >= 80 && code <= 82) return { kind:"rain", desc:"阵雨" };
  if(code === 95) return { kind:"storm", desc:"雷暴" };
  return { kind:"partly", desc:"多云" };
}
function loadWeather(){
  const url = "https://api.open-meteo.com/v1/forecast?latitude=22.5431&longitude=114.0579&current=temperature_2m,weather_code";
  try {
    fetch(url).then(r => r.json()).then(d => {
      const cur = d && d.current; if(!cur) return;
      const w = wmoWeather(cur.weather_code == null ? 3 : cur.weather_code);
      const t = document.getElementById("wTemp"); if(t) t.textContent = Math.round(cur.temperature_2m) + "°";
      const de = document.getElementById("wDesc"); if(de) de.textContent = w.desc;
      const ic = document.querySelector("#hhWeather .w-ico"); if(ic) ic.innerHTML = weatherIcon(w.kind);
    }).catch(() => {});
  } catch(e){}
}

/* 全站搜索：名称 / 网址 / 模块名 / 分类名 四维加权匹配 */
function searchAll(q){
  const s = (q || "").trim().toLowerCase();
  if(!s) return [];
  const out = [];
  CATS.filter(c => !c.home).forEach(c => {
    const ms = modulesOf(c.id) || defaultModules(c.id);
    (ms || []).forEach(m => {
      (m.links || []).forEach(l => {
        const name = (l.name || "").toLowerCase();
        const url  = (l.url || "").toLowerCase();
        const mt   = (m.title || "").toLowerCase();
        const cl   = (c.label || "").toLowerCase();
        let score = 0;
        if(name === s) score = 100;               // 完全命中
        else if(name.startsWith(s)) score = 82;   // 名称前缀
        else if(name.includes(s)) score = 62;     // 名称包含
        else if(mt.includes(s)) score = 40;       // 所属模块
        else if(url.includes(s)) score = 34;      // 网址
        else if(cl.includes(s)) score = 24;       // 分类名
        if(score > 0) out.push({ link:l, cat:c, mod:m, score: score + Math.min(l.visits || 0, 20) * 0.05 });
      });
    });
  });
  out.sort((a, b) => b.score - a.score);
  return out;
}
/* 关键词高亮（先转义再替换，避免 HTML 注入） */
function hl(text, q){
  const t = esc(text);
  const s = (q || "").trim();
  if(!s) return t;
  try {
    const re = new RegExp("(" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return t.replace(re, "<mark>$1</mark>");
  } catch(_){ return t; }
}
function renderSearch(q){
  const res = searchAll(q);
  const body = $("detailBody");
  const bizN = CATS.filter(x => !x.home).length;
  if(!res.length){
    body.innerHTML = '<div class="search-empty">未找到与「' + esc(q) + '」匹配的链接<br/>已搜索全部 ' + bizN +
      ' 个分类的名称 / 网址 / 模块名 / 分类名<br/>可换个更短的关键词，或点左侧菜单浏览。</div>';
    return;
  }
  const sum = document.createElement("div");
  sum.className = "search-sum";
  sum.innerHTML = '找到 <b>' + res.length + '</b> 个结果 · 关键词「' + esc(q) + '」· 按相关度与使用频次排序';
  body.appendChild(sum);
  const groups = [];
  res.forEach(r => {
    let g = groups.find(x => x.c.id === r.cat.id);
    if(!g){ g = { c: r.cat, hits: [] }; groups.push(g); }
    g.hits.push(r);
  });
  groups.forEach(g => {
    body.appendChild(sectionTitle(g.c.label + ' · ' + g.hits.length + ' 个'));
    const fg = document.createElement("div"); fg.className = "tile-grid";
    g.hits.forEach(r => fg.appendChild(buildSearchTile(r, q)));
    body.appendChild(fg);
  });
}
function buildSearchTile(r, q){
  const a = document.createElement("div"); a.className = "tile"; a.setAttribute("role","button"); a.tabIndex = 0;
  const ico = createIcon(r.link.name, r.link.url, "ico");
  const b = document.createElement("div"); b.className = "body";
  const nm = document.createElement("div"); nm.className = "nm"; nm.innerHTML = hl(r.link.name, q);
  const meta = document.createElement("div"); meta.className = "tile-meta";
  meta.innerHTML = '<span class="tm-mod">' + esc(r.mod.title) + '</span>' +
    (r.link.visits ? '<span class="tm-vis">用 ' + r.link.visits + '</span>' : '');
  b.append(nm, meta);
  a.append(ico, b);
  a.title = (r.link.url || "");
  a.addEventListener("click", () => openLink(r.link.url));
  a.addEventListener("keydown", e => { if(e.key === "Enter") openLink(r.link.url); });
  return a;
}

function menuCount(c){
  if(c.home) return 0;
  if(c.id==="common") return (load(STATE_KEY, []).length);
  if(c.id==="life") return (load("wb_life", []).length);
  let page = load(MODS_KEY, {})[c.id];
  let modules = page && page.modules ? page.modules : defaultModules(c.id);
  return modules.reduce((sum, m)=>sum+(m.links?m.links.length:0), 0);
}

/* 分类关键词，用于新增链接时自动归类 */
const CAT_KEYWORDS = {
  product: ["展会","产品","开发","选品","样品","工厂","1688","阿里","供应商","设计稿","规格"],
  visual:  ["视觉","设计","图片","素材","视频","剪辑","photoshop","海报","渲染","logo","配色","字体"],
  ops:     ["运营","广告","推广","亚马逊","amz","amazon","shopee","tiktok","物流","仓储","店铺","卖家","listing","投放"],
  erp:     ["erp","系统","官网","后台","wms","oms","管理","mes"],
  finance: ["财务","税","发票","报销","汇率","结算","银行","利润","成本","工资","账单"],
  news:    ["新闻","资讯","行业","论坛","知乎","公众号","趋势","报告","媒体"],
  forms:   ["表单","审核","审批","数据","报表","问卷","登记","流程"],
  agent:   ["智能体","ai","gpt","agent","机器人","助手","大模型","copilot"]
};
function guessCat(text){
  // 去掉 https:// ——否则 "https" 里的 "ps" 等短词会造成误命中
  const s = (text || "").toLowerCase().replace(/https?:\/\//g, " ");
  let best = null, bestN = 0;
  Object.keys(CAT_KEYWORDS).forEach(id => {
    let n = 0;
    CAT_KEYWORDS[id].forEach(k => { if(s.indexOf(k) >= 0) n++; });
    if(n > bestN){ bestN = n; best = id; }
  });
  return best;
}
function aiAddLink(name, url){
  // 名称优先归类，名称无命中再看网址，最后兜底到运营
  const catId = guessCat(name) || guessCat(url) || "ops";
  const c = CATS.find(x => x.id === catId) || CATS.find(x => !x.home);
  const modules = loadModules(c.id);
  let mod = modules[0];
  if(!mod){ mod = { id:"m_" + c.id + "_ai", title:"AI 收集", collapsed:false, links:[] }; modules.push(mod); }
  mod.links.push({ id:"l_" + Date.now(), name:name, url:url, visits:0 });
  saveModules(c.id, modules);
  renderMenu();
  if(activeId === c.id) renderDetail();
  const foot = $("footLinks"); if(foot) foot.textContent = allLinksCount();
  return { cat:c, mod:mod };
}
function aiStats(){
  const biz = CATS.filter(c => !c.home);
  const lines = biz.map(c => "· " + c.label + "：" + menuCount(c) + " 条");
  const all = allToolLinks();
  const top = all.filter(x => x.visits > 0).sort((a,b) => b.visits - a.visits).slice(0, 5);
  let txt = "当前共收录 " + allLinksCount() + " 条链接，分布在 " + biz.length + " 个分类：\n" + lines.join("\n");
  txt += top.length ? ("\n\n你最常用的 Top " + top.length + "：\n" + top.map((t,i) => (i+1) + ". " + t.name + "（" + t.visits + " 次）").join("\n"))
                    : "\n\n还没有使用记录，点几个工具后这里会显示常用排行。";
  return txt;
}
function aiReply(input){
  const s = (input || "").trim();
  if(!s) return { text:"" };

  /* ① 添加链接：添加链接 名称 网址 → 自动归类 */
  const addM = s.match(/^(?:添加|新增|add)\s*(?:链接|网址)?\s*(.+?)[\s，,、]+(https?:\/\/\S+|[\w-]+(?:\.[\w-]+)+(?:\/\S*)?)\s*$/i);
  if(addM){
    const name = addM[1].trim(), url = addM[2].trim();
    const r = aiAddLink(name, url);
    return { text:"已添加「" + name + "」\n→ 分类：" + r.cat.label + "\n→ 模块：" + r.mod.title + "\n" + url };
  }
  /* ② 打开：打开 关键词 → 直接跳转最匹配项 */
  const openM = s.match(/^(?:打开|open|启动|进入)\s*(.+)$/i);
  if(openM){
    const res = searchAll(openM[1]);
    if(res.length){
      openLink(res[0].link.url);
      return { text:"已为你打开最匹配的「" + res[0].link.name + "」（" + res[0].cat.label + "）。其他相关：",
        tools: res.slice(1, 5).map(x => ({ name:x.link.name, url:x.link.url, cat:x.cat.label })) };
    }
  }
  /* ③ 统计：我有多少链接 */
  if(/(多少|统计|数量|几个|概况|概览|排行)/.test(s) && /(链接|工具|网站|站点|数据|常用)/.test(s)) return { text: aiStats() };

  /* ④ 问候 / 能力 / 时间 / 日期 */
  if(/^(你好|hi|hello|嗨|在吗)/i.test(s))
    return { text:"你好！我可以帮你找工具、添加链接、看统计。\n直接输入关键词试试，比如「亚马逊」「展会」「汇率」。" };
  if(/(能做什么|功能|help|帮助|怎么用)/i.test(s))
    return { text:"我能做这些（全部本地运行，无需联网）：\n① 找工具：输入关键词，如「亚马逊」「展会」「财务」\n② 打开：输入「打开 亚马逊广告」直接跳转\n③ 添加：输入「添加链接 某某 https://xxx.com」，我会自动归类\n④ 统计：输入「我有多少链接」\n⑤ 时间 / 日期 / 简单算式，如 12 * 8" };
  if(/(你是谁|叫什么)/.test(s))
    return { text:"我是工作台的本地 AI 助理：自然语言找工具、自动归类新链接、查看使用统计。数据都在你本机，不会外传。" };
  if(/(几点|现在几点|什么时间)/.test(s))
    return { text:"现在时间是 " + new Date().toLocaleTimeString("zh-CN", { hour12:false }) };
  if(/(几号|今天日期|今天几号)/.test(s))
    return { text:"今天是 " + new Date().toLocaleDateString("zh-CN", { year:"numeric", month:"long", day:"numeric", weekday:"long" }) };
  const calc = s.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+\-*/xX×÷])\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(calc){
    const a = parseFloat(calc[1]), op = calc[2], b = parseFloat(calc[3]);
    let r;
    if(op === "+") r = a + b;
    else if(op === "-") r = a - b;
    else if(op === "*" || op === "x" || op === "X" || op === "×") r = a * b;
    else { if(b === 0) return { text:"除数不能为 0" }; r = +(a / b).toFixed(6); }
    return { text: a + " " + op + " " + b + " = " + r };
  }
  /* ⑤ 默认：自然语言找工具 */
  const res = searchAll(s);
  if(res.length){
    return { text:"为你找到 " + res.length + " 个相关工具，点击即可打开：",
      tools: res.slice(0, 8).map(x => ({ name:x.link.name, url:x.link.url, cat:x.cat.label })) };
  }
  return { text:"没找到与「" + s + "」匹配的链接。\n可以试试更短的关键词（如「亚马逊」「展会」「汇率」），或输入「帮助」看看我能做什么。" };
}

function renderAi(){
  const box = $("aiMsgs");
  if(!messages.length){
    box.innerHTML = '<div class="ai-empty">AI 助理（本地运行，无需联网）<br/>输入「亚马逊」「展会」即可找工具<br/>「添加链接 名称 网址」自动归类<br/>「我有多少链接」查看统计</div>';
    return;
  }
  box.innerHTML = "";
  messages.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg " + (m.role === "u" ? "u" : "a");
    d.textContent = m.t;
    box.appendChild(d);
    if(m.tools && m.tools.length){
      const tw = document.createElement("div"); tw.className = "msg-tools";
      m.tools.forEach(t => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "tool-chip"; b.title = t.url;
        const ic = createIcon(t.name, t.url, "ico");
        const sp = document.createElement("span"); sp.className = "tc-name"; sp.textContent = t.name;
        const cs = document.createElement("span"); cs.className = "tc-cat"; cs.textContent = t.cat;
        b.append(ic, sp, cs);
        b.onclick = () => openLink(t.url);
        tw.appendChild(b);
      });
      box.appendChild(tw);
    }
  });
  box.scrollTop = box.scrollHeight;
}

function sendAi(text){
  const s = (text ?? $("aiText").value).trim();
  if(!s) return;
  messages.push({ role:"u", t:s });
  const r = aiReply(s);
  const reply = (typeof r === "string") ? { text:r } : (r || {});
  messages.push({ role:"a", t:reply.text || "", tools: reply.tools || [] });
  save("wb_ai", messages);
  $("aiText").value = "";
  renderAi();
}

$("aiForm").addEventListener("submit", e=>{ e.preventDefault(); sendAi(); });
$("aiClear").onclick = ()=>{ messages=[]; save("wb_ai", messages); renderAi(); };
